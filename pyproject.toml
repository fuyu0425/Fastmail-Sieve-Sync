[project]
name = "sieve-sync"
version = "0.1.0"
description = "Sync Fastmail Seive Rules"
authors = [{ name = "Yu-Fu Fu", email = "yufu@yfu.tw" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.30.0,<3",
    "typed-argument-parser>=1.8.0,<2",
    "pyxdg>=0.28,<0.29",
]

[project.scripts]
sieve-sync = "sieve_sync.sieve_sync:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
